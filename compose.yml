services:

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================

  postgres:
    container_name: agent-postgres

    restart: unless-stopped

    build:
      context: ./postgresql
      dockerfile: Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Enable pgvector during first database initialization
      - ./postgresql/init/enable-vector.sql:/docker-entrypoint-initdb.d/enable-vector.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mynetwork


  # ============================================================
  # Redis
  # ============================================================

  redis:
    container_name: agent-redis

    restart: unless-stopped

    build:
      context: ./redis
      dockerfile: Dockerfile

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
      ]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mynetwork


  # ============================================================
  # User management API
  # ============================================================

  user-management:
    container_name: agent-user-management

    restart: unless-stopped

    build:
      context: .
      dockerfile: user_management/Dockerfile

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - mynetwork


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  postgres_data:
    name: agent_postgres_data

  redis_data:
    name: agent_redis_data


# ==============================================================
# Network
# ==============================================================

networks:

  mynetwork:
    name: mynetwork